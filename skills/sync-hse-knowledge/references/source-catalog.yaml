version: "1.0"
sources:
  - id: VN_GOV_LEGAL
    name: "Vietnam Government & National Gazette Legal Portal"
    jurisdiction: "VN"
    authority_level: "A1_MANDATORY_LAW"
    allowed_hosts:
      - "vanban.chinhphu.vn"
      - "congbao.chinhphu.vn"
    content_classes:
      - "legal_document"
      - "national_decree"
      - "circular"
    discovery:
      start_urls:
        - "https://vanban.chinhphu.vn/?pageid=27160"
        - "https://congbao.chinhphu.vn"
      strategies: ["search_index", "date_archive", "attachment_links"]
    fetch:
      rate_limit_rps: 1.0
      concurrency: 2
      timeout_seconds: 30
      retries: 3
      honor_robots_txt: true
      conditional_requests: true
    acquisition:
      unattended_required: true
      preferred_channels: ["official_api", "bulk_export", "http", "browser_render"]
      sanctioned_fallback_sources: ["VN_VBPL"]
      interactive_challenge_action: "quarantine_and_fallback"
    license:
      policy: "PUBLIC_DOWNLOAD"
      entitlement_required: false
    privacy:
      data_class: "public_knowledge"
    parsers: ["html", "pdf", "docx", "xlsx"]
    schedule:
      incremental: "0 2 * * *"
      full_reconcile: "0 4 1 * *"

