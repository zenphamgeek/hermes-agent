version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hse_user
      POSTGRES_PASSWORD: hse_password_2026
      POSTGRES_DB: hse_knowledge
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HSE_DATABASE_URL: postgresql://hse_user:hse_password_2026@postgres:5432/hse_knowledge
      HSE_REDIS_URL: redis://redis:6379/1
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: celery -A service.pipeline.tasks.celery_app worker --loglevel=info -Q sync,on_demand,maintenance
    environment:
      HSE_DATABASE_URL: postgresql://hse_user:hse_password_2026@postgres:5432/hse_knowledge
      HSE_REDIS_URL: redis://redis:6379/1
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
