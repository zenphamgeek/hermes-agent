[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-sync"
version = "1.1.0"
description = "Deterministic HS Knowledge Sync Service and CLI for Hermes Agent"
readme = "SKILL.md"
requires-python = ">=3.11"
authors = [
    { name = "Hermes Agent Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "boto3>=1.28.0",
    "selectolax>=0.3.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0"
]

[project.scripts]
hs-sync = "service.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["service*"]
