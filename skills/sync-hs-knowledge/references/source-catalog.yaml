sources:
  - id: VN_GOV_LEGAL
    name: "Vietnam Government Official Legal Portal"
    jurisdiction: VN
    authority_level: A1_SIGNED_OFFICIAL
    base_urls:
      - https://vanban.chinhphu.vn/
    allowed_hosts:
      - vanban.chinhphu.vn
    discovery:
      strategies: [sitemap, paginated_index, attachment_links]
      start_urls:
        - https://vanban.chinhphu.vn/he-thong-van-ban
    allowed_url_patterns:
      - "https://vanban.chinhphu.vn/*"
    denied_url_patterns:
      - "*/login*"
      - "*/captcha*"
    content_classes:
      - legal_document
      - decree
      - circular
      - consolidated_document
    fetch:
      rate_limit_rps: 0.5
      concurrency: 2
      timeout_seconds: 60
      retries: 4
      honor_robots_txt: true
      conditional_requests: true
      retry_policy: adaptive_v1
      max_retry_budget_minutes: 120
      circuit_breaker_threshold: 8
    acquisition:
      unattended_required: true
      preferred_channels: [official_api, bulk_export, http, browser_render]
      sanctioned_fallback_sources: []
      browser_render:
        enabled: true
        persistent_profile: false
        solve_interactive_challenge: false
        stealth: false
        proxy_rotation: false
      interactive_challenge_action: quarantine_and_fallback
    license:
      policy: PUBLIC_DOWNLOAD
      entitlement_required: false
    parsers: [html, pdf, docx]
    schedule:
      incremental: "0 2 * * *"
      full_reconcile: "0 3 1 * *"

